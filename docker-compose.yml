services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jojoba-api
    restart: unless-stopped
    ports:
      - "${PORT:-8001}:8001"
    env_file:
      - .env
    volumes:
      - chroma-data:/app/data/chroma_db
    networks:
      - jojoba-net

  jobs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jojoba-jobs
    profiles: ["jobs"]
    env_file:
      - .env
    volumes:
      - chroma-data:/app/data/chroma_db
    entrypoint: ["python"]
    networks:
      - jojoba-net

networks:
  jojoba-net:
    driver: bridge

volumes:
  chroma-data: