services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jojoba-api
    restart: unless-stopped
    ports:
      - "${PORT:-8001}:8001"
    env_file:
      - .env
    volumes:
      - chroma-data:/app/data/chroma_db
    networks:
      - jojoba-net

  jobs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jojoba-jobs
    profiles: ["jobs"]
    env_file:
      - .env
    volumes:
      - chroma-data:/app/data/chroma_db
    entrypoint: ["python"]
    command: ["-m", "jobs.reindex_rag"]
    networks:
      - jojoba-net

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jojoba-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api
    networks:
      - jojoba-net

  mongo:
    image: mongo:7
    container_name: jojoba-mongo
    profiles: ["local-db"]
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jojoba-net

networks:
  jojoba-net:
    driver: bridge

volumes:
  mongo-data:
  chroma-data: